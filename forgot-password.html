```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f3f6fb;
        }

        .box {
            width: 400px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        p {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #2563eb;
            text-decoration: none;
        }

        #message {
            margin-top: 15px;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>Forgot Password?</h1>

    <p>Enter your registered email address.</p>

    <form id="forgotForm">

        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
        >

        <button type="submit">Reset Password</button>

    </form>

    <p id="message"></p>

    <a class="back" href="login.html">Back to Login</a>

</div>

<script>

document.getElementById("forgotForm").addEventListener("submit", function(e) {

    e.preventDefault();

    const email = document.getElementById("email").value;

    const account = JSON.parse(
        localStorage.getItem("jobTrackerAccount")
    );

    const message = document.getElementById("message");

    if (!account || account.email !== email) {
        message.innerText = "Email address not found.";
        message.style.color = "red";
        return;
    }

    /*
       Demo frontend reset:
       In a real application this would send
       an OTP/reset link through the backend.
    */

    const newPassword = prompt(
        "Enter your new password:"
    );

    if (!newPassword) {
        return;
    }

    account.password = newPassword;

    localStorage.setItem(
        "jobTrackerAccount",
        JSON.stringify(account)
    );

    message.innerText =
        "Password changed successfully. You can login now.";

    message.style.color = "green";

});

</script>

</body>
</html>
