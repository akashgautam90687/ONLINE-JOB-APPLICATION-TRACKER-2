<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Tracker</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f4f7fb;
        }

        .container {
            width: 475px;
            background: white;
            padding: 45px;
            border-radius: 18px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.10);
        }

        h1 {
            text-align: center;
            font-size: 40px;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            font-size: 20px;
            margin-bottom: 38px;
        }

        input,
        select {
            width: 100%;
            height: 54px;
            padding: 0 17px;
            margin-bottom: 18px;
            border: 1px solid #d7d7d7;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
            background: white;
        }

        input:focus,
        select:focus {
            border-color: #2563eb;
        }

        button {
            width: 100%;
            height: 57px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .links {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }

        .links a {
            color: #2563eb;
            font-size: 15px;
            text-decoration: none;
            cursor: pointer;
        }

        .links a:hover {
            text-decoration: underline;
        }

        .message {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #2563eb;
            cursor: pointer;
            font-size: 15px;
        }

        .hidden {
            display: none;
        }

        .password-note {
            color: #777;
            font-size: 13px;
            margin-top: -8px;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

<div class="container">

    <!-- ================= LOGIN ================= -->

    <div id="loginSection">

        <h1>Job Tracker</h1>

        <p class="subtitle">Login to continue</p>

        <form id="loginForm">

            <input
                type="email"
                id="loginEmail"
                placeholder="Enter Email"
                required
            >

            <input
                type="password"
                id="loginPassword"
                placeholder="Enter Password"
                required
            >

            <select id="loginRole" required>
                <option value="">Select Role</option>
                <option value="jobseeker">Job Seeker</option>
                <option value="recruiter">Recruiter</option>
            </select>

            <button type="submit">Login</button>

        </form>

        <!-- THESE ARE INSIDE THE SAME CARD -->
        <div class="links">
            <a onclick="showForgot()">Forgot Password?</a>
            <a onclick="showCreate()">Create Account</a>
        </div>

        <p id="loginMessage" class="message"></p>

    </div>


    <!-- ================= CREATE ACCOUNT ================= -->

    <div id="createSection" class="hidden">

        <h1>Create Account</h1>

        <p class="subtitle">Create your Job Tracker account</p>

        <form id="createForm">

            <input
                type="text"
                id="createName"
                placeholder="Full Name"
                required
            >

            <input
                type="email"
                id="createEmail"
                placeholder="Enter Email"
                required
            >

            <input
                type="tel"
                id="createPhone"
                placeholder="Mobile Number"
                required
            >

            <input
                type="password"
                id="createPassword"
                placeholder="Create Password"
                required
            >

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm Password"
                required
            >

            <select id="createRole" required>
                <option value="">Select Role</option>
                <option value="jobseeker">Job Seeker</option>
                <option value="recruiter">Recruiter</option>
            </select>

            <button type="submit">Create Account</button>

        </form>

        <div class="back" onclick="showLogin()">
            ← Back to Login
        </div>

        <p id="createMessage" class="message"></p>

    </div>


    <!-- ================= FORGOT PASSWORD ================= -->

    <div id="forgotSection" class="hidden">

        <h1>Forgot Password?</h1>

        <p class="subtitle">
            Reset your Job Tracker password
        </p>

        <form id="forgotForm">

            <input
                type="email"
                id="forgotEmail"
                placeholder="Enter Registered Email"
                required
            >

            <input
                type="password"
                id="newPassword"
                placeholder="Enter New Password"
                required
            >

            <input
                type="password"
                id="confirmNewPassword"
                placeholder="Confirm New Password"
                required
            >

            <button type="submit">Reset Password</button>

        </form>

        <div class="back" onclick="showLogin()">
            ← Back to Login
        </div>

        <p id="forgotMessage" class="message"></p>

    </div>

</div>


<script>

    // ==========================================
    // SHOW LOGIN
    // ==========================================

    function showLogin() {

        document.getElementById("loginSection")
            .classList.remove("hidden");

        document.getElementById("createSection")
            .classList.add("hidden");

        document.getElementById("forgotSection")
            .classList.add("hidden");

    }


    // ==========================================
    // SHOW CREATE ACCOUNT
    // ==========================================

    function showCreate() {

        document.getElementById("loginSection")
            .classList.add("hidden");

        document.getElementById("createSection")
            .classList.remove("hidden");

        document.getElementById("forgotSection")
            .classList.add("hidden");

    }


    // ==========================================
    // SHOW FORGOT PASSWORD
    // ==========================================

    function showForgot() {

        document.getElementById("loginSection")
            .classList.add("hidden");

        document.getElementById("createSection")
            .classList.add("hidden");

        document.getElementById("forgotSection")
            .classList.remove("hidden");

    }


    // ==========================================
    // CREATE ACCOUNT
    // ==========================================

    document.getElementById("createForm")
        .addEventListener("submit", function(e) {

        e.preventDefault();

        const name =
            document.getElementById("createName").value;

        const email =
            document.getElementById("createEmail").value;

        const phone =
            document.getElementById("createPhone").value;

        const password =
            document.getElementById("createPassword").value;

        const confirmPassword =
            document.getElementById("confirmPassword").value;

        const role =
            document.getElementById("createRole").value;


        if (password !== confirmPassword) {

            document.getElementById("createMessage").innerText =
                "Passwords do not match.";

            document.getElementById("createMessage").style.color =
                "red";

            return;
        }


        const account = {

            name: name,
            email: email,
            phone: phone,
            password: password,
            role: role

        };


        localStorage.setItem(
            "jobTrackerAccount",
            JSON.stringify(account)
        );


        document.getElementById("createMessage").innerText =
            "Account created successfully!";

        document.getElementById("createMessage").style.color =
            "green";


        setTimeout(function() {

            showLogin();

            document.getElementById("loginEmail").value =
                email;

        }, 1200);

    });


    // ==========================================
    // LOGIN
    // ==========================================

    document.getElementById("loginForm")
        .addEventListener("submit", function(e) {

        e.preventDefault();

        const email =
            document.getElementById("loginEmail").value;

        const password =
            document.getElementById("loginPassword").value;

        const role =
            document.getElementById("loginRole").value;


        const account =
            JSON.parse(
                localStorage.getItem("jobTrackerAccount")
            );


        if (!account) {

            document.getElementById("loginMessage").innerText =
                "No account found. Please create an account.";

            document.getElementById("loginMessage").style.color =
                "red";

            return;
        }


        if (
            email !== account.email ||
            password !== account.password ||
            role !== account.role
        ) {

            document.getElementById("loginMessage").innerText =
                "Invalid email, password or role.";

            document.getElementById("loginMessage").style.color =
                "red";

            return;
        }


        // Save login status
        localStorage.setItem("loggedIn", "true");
        localStorage.setItem("userEmail", email);
        localStorage.setItem("userRole", role);


        // Redirect according to role
        if (role === "jobseeker") {

            window.location.href = "jobseeker.html";

        }

        else if (role === "recruiter") {

            window.location.href = "recruiter.html";

        }

    });


    // ==========================================
    // FORGOT PASSWORD
    // ==========================================

    document.getElementById("forgotForm")
        .addEventListener("submit", function(e) {

        e.preventDefault();


        const email =
            document.getElementById("forgotEmail").value;

        const newPassword =
            document.getElementById("newPassword").value;

        const confirmNewPassword =
            document.getElementById("confirmNewPassword").value;


        const account =
            JSON.parse(
                localStorage.getItem("jobTrackerAccount")
            );


        if (!account || account.email !== email) {

            document.getElementById("forgotMessage").innerText =
                "Email not found.";

            document.getElementById("forgotMessage").style.color =
                "red";

            return;
        }


        if (newPassword !== confirmNewPassword) {

            document.getElementById("forgotMessage").innerText =
                "Passwords do not match.";

            document.getElementById("forgotMessage").style.color =
                "red";

            return;
        }


        account.password = newPassword;


        localStorage.setItem(
            "jobTrackerAccount",
            JSON.stringify(account)
        );


        document.getElementById("forgotMessage").innerText =
            "Password reset successfully!";

        document.getElementById("forgotMessage").style.color =
            "green";


        setTimeout(function() {

            showLogin();

        }, 1200);

    });

</script>

</body>
</html>
