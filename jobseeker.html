<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Job Seeker Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
        }

        nav {
            background: #2563eb;
            color: white;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .dashboard {
            padding: 40px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }

        .card h2 {
            margin-bottom: 10px;
        }

        .card button {
            margin-top: 15px;
            padding: 10px 15px;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            cursor: pointer;
        }

        .logout {
            background: #ef4444;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <nav>
        <h2>Job Seeker</h2>
        <button class="logout" onclick="logout()">Logout</button>
    </nav>

    <div class="dashboard">

        <h1>Welcome, Job Seeker 👋</h1>
        <p>Manage your job applications from here.</p>

        <div class="cards">

            <div class="card">
                <h2>🔍 Find Jobs</h2>
                <p>Search for new job opportunities.</p>
                <button>Search Jobs</button>
            </div>

            <div class="card">
                <h2>📋 My Applications</h2>
                <p>Track your submitted applications.</p>
                <button>View Applications</button>
            </div>

            <div class="card">
                <h2>❤️ Saved Jobs</h2>
                <p>View your saved jobs.</p>
                <button>Saved Jobs</button>
            </div>

            <div class="card">
                <h2>👤 Profile</h2>
                <p>Update your profile and resume.</p>
                <button>My Profile</button>
            </div>

        </div>

    </div>

    <script>

        // Protect dashboard
        if (localStorage.getItem("loggedIn") !== "true") {
            window.location.href = "login.html";
        }

        function logout() {
            localStorage.removeItem("loggedIn");
            localStorage.removeItem("userEmail");
            localStorage.removeItem("userRole");

            window.location.href = "login.html";
        }

    </script>

</body>
</html>
